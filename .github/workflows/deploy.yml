name: Build and deploy mobile PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Checkout mobile app
        uses: actions/checkout@v4
        with:
          repository: Last-Minute-App/mobile-app
          path: mobile-app
          token: ${{ secrets.MOBILE_APP_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mobile dependencies
        working-directory: mobile-app
        # npm install (not npm ci) so the build tolerates lockfile drift from
        # devDependencies added without a regenerated package-lock.json (e.g.
        # the jest test toolchain). Mirrors verify.yml, which uses the same
        # approach and is why type-check/lint/tests stay green.
        run: npm install --no-audit --no-fund

      - name: Build mobile PWA for /dashboard
        working-directory: dashboard
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'https://last-minute-app-904761941913.europe-west1.run.app' }}
          EXPO_PUBLIC_WEB_BASE_PATH: /dashboard
        run: npm run build

      - name: SPA deep-link fallback
        working-directory: dashboard
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
