name: Build and deploy mobile PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes Ubuntu 26 on 2026-10-19
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Checkout mobile app
        uses: actions/checkout@v4
        with:
          repository: Last-Minute-App/mobile-app
          path: mobile-app
          # Normally the newest main. Setting the repository variable MOBILE_APP_REF to a commit or tag builds exactly that
          # one instead (a rollback, or holding back unreleased commits) - then clear the variable.
          ref: ${{ vars.MOBILE_APP_REF || 'main' }}
          token: ${{ secrets.MOBILE_APP_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          # 22 = the version the app's own CI (mobile verify.yml) tests with; Node 20 reached end of life in April 2026.
          node-version: "22"

      - name: Install mobile dependencies
        working-directory: mobile-app
        # npm ci: install EXACTLY what package-lock.json records, so a package published today can never reach the live app
        # (security review 2026-10-20 #4; the admin dashboard holds admin tokens). It used to be `npm install` because the
        # lockfile lacked the jest devDependencies (2026-08-19); the lockfile is complete now (verified 2026-10-20 with npm 10,
        # the version Node 22 ships). If someone adds a dependency without committing the lockfile, THIS step fails loudly and
        # the live site stays as it is - fix it with `npm install` in the app and commit package-lock.json.
        run: npm ci --no-audit --no-fund

      # Only a commit that passes the app's own checks is published (audit 2026-10-15: this workflow used to build whatever was
      # newest on the app's main, tested or not, while the API's deploy has been gated since 2026-10-13). Same commands as the
      # app's Verify workflow, run on the exact commit that is about to be built. A failure stops here and the live site stays as it is.
      - name: Gate - the app commit being built (guards, types, unit tests)
        working-directory: mobile-app
        run: |
          echo "Building app commit $(git rev-parse HEAD)"
          echo "### App commit built: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/verify-all.py
          npx tsc --noEmit
          npm test

      - name: Build mobile PWA for /dashboard
        working-directory: dashboard
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'https://api-970513392417.europe-west1.run.app' }}
          EXPO_PUBLIC_WEB_BASE_PATH: /dashboard
        run: npm run build

      - name: SPA deep-link fallback
        working-directory: dashboard
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes Ubuntu 26 on 2026-10-19
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
