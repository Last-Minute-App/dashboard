name: Build and deploy dashboard to GitHub Pages

# Runs on every push to main. Builds the Vite SPA and publishes the
# static `dist/` folder to GitHub Pages.
#
# When the repo is `last-minute-app/dashboard`, GH Pages will serve at
#   https://last-minute-app.github.io/dashboard/
# which is exactly what `vite.config.ts` (base: '/dashboard/') expects.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Build
        env:
          # Override at Settings → Variables → Actions → VITE_API_BASE_URL
          # if/when the backend moves. Default = Cloud Run API.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://last-minute-app-904761941913.europe-west1.run.app' }}
        run: npm run build

      - name: SPA deep-link fallback
        # GH Pages serves 404.html for unknown paths; we copy index.html
        # on top so React Router takes over once the SPA loads.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
