name: Build and deploy dashboard to GitHub Pages

# Standalone-repo layout: this repo contains ONLY the dashboard.
# Build the Vite SPA, publish dist/ to GitHub Pages.
#
# Repo: last-minute-app/dashboard
# Live URL: https://last-minute-app.github.io/dashboard/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # No --frozen-lockfile: lets yarn generate yarn.lock if it's
        # missing (e.g. when the repo was initialised via GH browser
        # upload and the lockfile got skipped by the drag-and-drop).
        run: yarn install

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://expire-now.preview.emergentagent.com' }}
        run: yarn build

      - name: SPA deep-link fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
